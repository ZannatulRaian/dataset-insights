name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dataset-insights .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name app dataset-insights
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
